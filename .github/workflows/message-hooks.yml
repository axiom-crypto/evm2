name: Message hooks

on:
  push:
    branches: [lighter/message-hooks]

permissions:
  contents: read

jobs:
  unit:
    name: evm2 unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: tempoxyz/gh-actions/vendor/dtolnay/rust-toolchain@2ab28a31ae569be9f780c7675b684471060afa40
        with:
          toolchain: stable
      - uses: tempoxyz/gh-actions/vendor/taiki-e/install-action@2ab28a31ae569be9f780c7675b684471060afa40
        with:
          tool: nextest@0.9.140
          checksum: true
          fallback: none
      - run: cargo nextest run --locked -p evm2 --lib
